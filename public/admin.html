<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Vehicle Sales</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">G</span><span>ADMIN <b>DASHBOARD</b></span></a><a href="/">← View website</a></header>
<main class="admin-wrap"><section id="loginPanel" class="admin-card" style="max-width:420px;margin:70px auto"><h2>Admin login</h2><p>Sign in to manage applications, vehicles and company details.</p><form id="loginForm"><label>Username<input class="admin-input" name="username" required></label><br><br><label>Password<input class="admin-input" name="password" type="password" required></label><br><br><button class="admin-btn gold-btn">Sign in</button><p id="loginError" class="form-message"></p></form></section>
<section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><div><span class="eyebrow">CONTROL CENTRE</span><h2>Dashboard</h2></div><button class="admin-btn" id="logoutBtn">Log out</button></div>
<div class="admin-grid" id="stats"></div>
<div class="admin-card"><h3>Customer applications</h3><div id="applications"></div></div>
<div class="admin-card"><h3>Manage vehicle listings</h3><button class="admin-btn gold-btn" id="newVehicle">+ Add vehicle</button><div id="vehicles"></div></div>
<div class="admin-card"><h3>Company settings</h3><form id="settingsForm" class="form-grid">
<label>moggo motors<input class="admin-input" name="company_name" required></label><label>Business WhatsApp number (international format)<input class="admin-input" name="whatsapp" required placeholder="254780547049"></label><label>Phone<input class="admin-input" name="phone"></label><label>Email<input class="admin-input" name="email" type="email"></label><label>Address<input class="admin-input" name="address"></label><label class="full">About the company<textarea class="admin-input" name="about" rows="3"></textarea></label><button class="admin-btn gold-btn">Save settings</button><p id="settingsMessage"></p></form></div>
</section></main><script src="/admin.js"></script></body></html>
